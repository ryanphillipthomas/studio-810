# Deployment source of truth (docs/sources-of-truth.md).
#
# One static site serves the whole umbrella: the service routes sub-apps by
# path (/poc), so tools/site-compose copies the committed app directories into
# dist/ per its site-map.json. COPY-ONLY — nothing is generated or rewritten at
# deploy time: what was reviewed is what deploys.
#
# This blueprint deploys to wearestudio810.onrender.com. The public site at
# wearestudio810.com is a separate Squarespace property, not served from this
# repository — nothing here affects it.
#
# PR previews come from Render's *service previews*, enabled in the dashboard
# (Service -> Previews -> Automatic). There is no render.yaml field for them:
# this file cannot turn them on. They were enabled for this service on
# 2026-08-31; note that a service recreated under a new name starts with
# previews off again, so re-enable after any rename.
#
# The `previews` block below is a different feature: preview *environments*,
# which clone every service in the blueprint. Harmless while this blueprint
# holds one static site; adding a paid service would make each PR provision a
# billed copy of it.
previews:
  generation: automatic

services:
  - type: web
    name: wearestudio810
    runtime: static
    buildCommand: node tools/site-compose/index.mjs
    staticPublishPath: dist
    autoDeployTrigger: commit
