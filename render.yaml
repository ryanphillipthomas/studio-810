# Deployment source of truth (docs/sources-of-truth.md).
#
# One static site serves the whole umbrella: the service routes sub-apps by
# path (/poc), so tools/site-compose copies the committed app directories into
# dist/ per its site-map.json. COPY-ONLY — nothing is generated or rewritten at
# deploy time: what was reviewed is what deploys.
#
# This blueprint deploys to wearestudio810.onrender.com. The public site at
# wearestudio810.com is a separate Squarespace property, not served from this
# repository — nothing here affects it.
#
# PR previews come from Render's *service previews*, a dashboard toggle with
# no render.yaml field: this file cannot turn them on. As of 2026-08-31 they
# are OFF for this service by choice; deploy.config.json and the release
# records are where actual dashboard state is checked. A service recreated
# under a new name starts with previews off again.
#
# The dashboard display names are "studio-810" (this service) and
# "studio-810-staging" — intentional, 2026-08-31. The `name` below stays
# `wearestudio810` on purpose: it is the blueprint identity and the source of
# the onrender.com slug, and renaming it in a blueprint risks recreating the
# service (new slug, toggles reset). pipeline/deploy.config.json declares the
# display names the deploy gate checks against.
#
# The `previews` block below is a different feature: preview *environments*,
# which clone every service in the blueprint. Harmless while this blueprint
# holds one static site; adding a paid service would make each PR provision a
# billed copy of it.
previews:
  generation: automatic

services:
  - type: web
    name: wearestudio810
    runtime: static
    buildCommand: node tools/site-compose/index.mjs
    staticPublishPath: dist
    autoDeployTrigger: commit
